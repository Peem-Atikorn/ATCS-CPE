name: 08-deploy-config
on:
  pull_request:
    branches: [develop, main]
    paths:
      - "docker-compose.yml"
      - ".dockerignore"
      - ".env.example"
      - "Makefile"
      - "deploy/**"
      - "eval/**"
      - ".github/workflows/**"
  push:
    branches: [develop, main]
    paths:
      - "docker-compose.yml"
      - ".dockerignore"
      - ".env.example"
      - "Makefile"
      - "deploy/**"
      - "eval/**"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-08-${{ github.ref }}
  cancel-in-progress: true
jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f docker-compose.yml config --quiet
      - run: python -m py_compile deploy/smoke.py deploy/warmup.py deploy/preflight.py deploy/monitor.py eval/run_live.py eval/build_report.py
      - run: python -m unittest discover -s deploy -p 'test_tools.py'
      - run: python eval/build_report.py
      - run: git diff --exit-code -- eval/report.html
