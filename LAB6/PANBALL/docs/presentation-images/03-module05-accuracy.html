<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แม่นขึ้นเท่าไร และวัดอย่างไร</title><style>body{margin:0;background:#141936;font-family:Tahoma, Arial, sans-serif}.diagram-container{width:100%;overflow-x:auto}svg{width:1280px;min-width:1280px;display:block}@media print{.diagram-container{overflow:visible}svg{width:100%;min-width:0}}</style></head><body><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="03-module05-accuracy-title 03-module05-accuracy-desc"><title id="03-module05-accuracy-title">แม่นขึ้นเท่าไร และวัดอย่างไร</title><desc id="03-module05-accuracy-desc">ในการวัดวันที่ 27 ก.ย. 2026 ชุดชื่อเล่น 33 กรณี Hybrid พบเอกสารคำตอบอันดับแรก 28 กรณี (84.8%) ขณะที่เพิ่ม ms-marco reranker ได้ 31 กรณี (93.9%) เพิ่ม 9.1 จุดเปอร์เซ็นต์ คะแนนนี้เปรียบเทียบวิธีจัดอันดับ ไม่ใช่ผลก่อนและหลังแก้ alias ชุดรวมมี 233 กรณีที</desc><defs><marker id="03-module05-accuracy-M-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#16cfa0"/></marker><marker id="03-module05-accuracy-M-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#b386fc"/></marker><marker id="03-module05-accuracy-M-soft" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#b8c3dc"/></marker><marker id="03-module05-accuracy-M-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polyline points="0 0,8 4,0 8" fill="none" stroke="#b8c3dc" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#141936" stroke="none" stroke-width="1.5"/><text x="640" y="51" font-family="Tahoma, Arial, sans-serif" font-size="12" fill="#b8c3dc" text-anchor="middle" font-weight="400">MODULE 05 · MEASURED RESULTS</text><text x="640" y="108" font-family="Tahoma, Arial, sans-serif" font-size="40" fill="#ffffff" text-anchor="middle" font-weight="700">แม่นขึ้นเท่าไร และวัดอย่างไร</text><text x="60" y="185" font-family="Tahoma, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="700">Hit@1 ในชุดชื่อเล่น 33 กรณี</text><text x="60" y="248" font-family="Tahoma, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="700">Hybrid</text><rect x="60" y="268" width="509" height="44" rx="4" fill="#b8c3dc" stroke="none" stroke-width="1.5"/><text x="585.090909090909" y="297" font-family="Tahoma, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="700">84.8%</text><text x="60" y="376" font-family="Tahoma, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="700">+ ms-marco</text><rect x="60" y="396" width="564" height="44" rx="4" fill="#ff782d" stroke="none" stroke-width="1.5"/><text x="639.6363636363636" y="425" font-family="Tahoma, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="700">93.9%</text><text x="60" y="546" font-family="Tahoma, Arial, sans-serif" font-size="40" fill="#ffffff" text-anchor="start" font-weight="700">28/33 → 31/33</text><text x="60" y="588" font-family="Tahoma, Arial, sans-serif" font-size="16" fill="#b8c3dc" text-anchor="start" font-weight="400">เพิ่ม 9.1 จุดเปอร์เซ็นต์จากการ rerank</text><g class="node"><rect x="824" y="164" width="388" height="460" rx="8" fill="#ffffff" stroke="#e2e7f0" stroke-width="1.5"/><text x="840" y="189" font-family="Tahoma, Arial, sans-serif" font-size="12" fill="#68738a" text-anchor="start" font-weight="700">BENCHMARK · 27 SEP 2026</text><text x="840" y="218" font-family="Tahoma, Arial, sans-serif" font-size="16" fill="#202940" text-anchor="start" font-weight="700">วิธีวัดผล</text><text x="840" y="250" font-family="Tahoma, Arial, sans-serif" font-size="12" fill="#68738a" text-anchor="start" font-weight="400">1,967 เอกสาร / 1,999 chunks</text><text x="840" y="270" font-family="Tahoma, Arial, sans-serif" font-size="12" fill="#68738a" text-anchor="start" font-weight="400">233 กรณีที่มีคำตอบ + 20 ไม่มีคำตอบ</text><text x="840" y="290" font-family="Tahoma, Arial, sans-serif" font-size="12" fill="#68738a" text-anchor="start" font-weight="400">CPU เท่านั้น / warm-up 3 คำถาม</text><text x="840" y="310" font-family="Tahoma, Arial, sans-serif" font-size="12" fill="#68738a" text-anchor="start" font-weight="400">candidate_k=20 / RRF k=60</text><text x="840" y="330" font-family="Tahoma, Arial, sans-serif" font-size="12" fill="#68738a" text-anchor="start" font-weight="400">จับ time.perf_counter รอบ Searcher.search</text><text x="840" y="350" font-family="Tahoma, Arial, sans-serif" font-size="12" fill="#68738a" text-anchor="start" font-weight="400">Hit@1: เอกสารถูกต้องอยู่ลำดับแรก</text><text x="840" y="370" font-family="Tahoma, Arial, sans-serif" font-size="12" fill="#68738a" text-anchor="start" font-weight="400">Hit@5: อยู่ภายในห้าอันดับแรก</text><text x="840" y="390" font-family="Tahoma, Arial, sans-serif" font-size="12" fill="#68738a" text-anchor="start" font-weight="400">MRR: ค่าเฉลี่ย 1 / อันดับที่ถูกต้อง</text><text x="840" y="410" font-family="Tahoma, Arial, sans-serif" font-size="12" fill="#68738a" text-anchor="start" font-weight="400">p95: 95% ของคำค้นเร็วไม่เกินค่านี้</text></g><path d="M40 656 H1240" stroke="#394261"/><text x="40" y="687" font-family="Tahoma, Arial, sans-serif" font-size="12" fill="#b8c3dc" text-anchor="start" font-weight="400">ชุดชื่อเล่นนี้เทียบ Hybrid กับ reranker ไม่ใช่ A/B ของ alias · ไม่รวม HTTP / โหลดโมเดล</text><text x="1240" y="687" font-family="Tahoma, Arial, sans-serif" font-size="12" fill="#b8c3dc" text-anchor="end" font-weight="700">PANBALL</text></svg></div></body></html>
